<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FitNutrition | Registro</title>
  <link rel="stylesheet" href="styless.css">
</head>
<body>

  <header>
    <h1>FitNutrition</h1>
    <nav>
      <a href="index.html">Inicio</a>
      <a href="registro.html" class="active">Registro / Ingreso</a>
    </nav>
  </header>

  <main>

    <section id="registro">
      <h2>Crear cuenta</h2>
      <form id="formRegistro">
        <label for="regNombre">Nombre completo</label>
        <input type="text" 
               id="regNombre" 
               name="nombre" autocomplete="name" required>

        <label for="regEmail">Correo electrónico</label>
        <input type="email"
               id="regEmail" 
               name="email" autocomplete="email" required>

        <label for="regPassword">Contraseña</label>
        <input type="password" 
               id="regPassword" 
               name="password" autocomplete="newPassword" required>

        <button type="submit">Registrarme</button>
      </form>
    </section>

    <section id="login">
      <h2>Iniciar sesión</h2>
      <form id="formLogin">
        <label for="loginEmail">Correo electrónico</label>
        <input type="email" 
                id="loginEmail" 
                name="email" autocomplete="email" required>

        <label for="loginPassword">Contraseña</label>
        <input type="password" 
                id="loginPassword" 
                name="password" autocomplete="currentPassword" required>

        <button type="submit">Ingresar</button>
      </form>
    </section>

  </main>

  <footer>
    <p>&copy; 2026 FitNutrition. Todos los derechos reservados.</p>
  </footer>

</body>
</html>
