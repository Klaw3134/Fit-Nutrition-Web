<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SuplementosFit - Registro</title>
  <link rel="stylesheet" href="styless.css">
</head>
<body>

  <header>
    <h1>SuplementosFit</h1>
    <nav>
      <a href="index.html">Inicio</a>
      <a href="registro.html" class="active">Registro / Ingreso</a>
    </nav>
  </header>

  <main>

    <section id="registro">
      <h2>Crear cuenta</h2>
      <form id="form-registro">
        <label for="reg-nombre">Nombre completo</label>
        <input type="text" 
               id="reg-nombre" 
               name="nombre" autocomplete="name" required>

        <label for="reg-email">Correo electrónico</label>
        <input type="email"
               id="reg-email" 
               name="email" autocomplete="email" required>

        <label for="reg-password">Contraseña</label>
        <input type="password" 
               id="reg-password" 
               name="password" autocomplete="new-password" required>

        <button type="submit">Registrarme</button>
      </form>
    </section>

    <section id="login">
      <h2>Iniciar sesión</h2>
      <form id="form-login">
        <label for="login-email">Correo electrónico</label>
        <input type="email" 
                id="login-email" 
                name="email" autocomplete="email" required>

        <label for="login-password">Contraseña</label>
        <input type="password" 
                id="login-password" 
                name="password" autocomplete="current-password" required>

        <button type="submit">Ingresar</button>
      </form>
    </section>

  </main>

  <footer>
    <p>&copy; 2026 SuplementosFit. Todos los derechos reservados.</p>
  </footer>

</body>
</html>
